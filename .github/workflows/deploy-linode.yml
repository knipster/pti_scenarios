# Publish the calculator site (with calculator2.html as the home page) to the Linode (Akamai) Object Storage bucket
# that serves calc.platform.tennis.
#
# Runs on every push to main, and on demand from the Actions tab
# ("Run workflow"), where you can choose a dry run that only previews changes.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   LINODE_S3_ACCESS_KEY  Object Storage access key (Cloud Manager → Object Storage → Access Keys)
#   LINODE_S3_SECRET_KEY  its secret key
#   LINODE_S3_ENDPOINT    the bucket's cluster endpoint, e.g. https://us-east-1.linodeobjects.com
name: Deploy to Linode

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; upload nothing"
        type: boolean
        default: false
      delete:
        description: "Also remove files from the bucket that are no longer in the repo"
        type: boolean
        default: false

permissions:
  contents: read

# Never let two deploys write to the bucket at once; the newest push wins.
concurrency:
  group: deploy-linode
  cancel-in-progress: true

env:
  BUCKET: calc.platform.tennis

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          LINODE_S3_ACCESS_KEY: ${{ secrets.LINODE_S3_ACCESS_KEY }}
          LINODE_S3_SECRET_KEY: ${{ secrets.LINODE_S3_SECRET_KEY }}
          LINODE_S3_ENDPOINT: ${{ secrets.LINODE_S3_ENDPOINT }}
        run: |
          missing=()
          [ -n "$LINODE_S3_ACCESS_KEY" ] || missing+=(LINODE_S3_ACCESS_KEY)
          [ -n "$LINODE_S3_SECRET_KEY" ] || missing+=(LINODE_S3_SECRET_KEY)
          [ -n "$LINODE_S3_ENDPOINT" ] || missing+=(LINODE_S3_ENDPOINT)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi
          case "$LINODE_S3_ENDPOINT" in https://*) ;; *)
            echo "::error::LINODE_S3_ENDPOINT should start with https://"; exit 1 ;;
          esac

      - name: Sync to s3://${{ env.BUCKET }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LINODE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LINODE_S3_SECRET_KEY }}
          ENDPOINT: ${{ secrets.LINODE_S3_ENDPOINT }}
          # Linode ignores the region, but the AWS CLI insists on one.
          AWS_DEFAULT_REGION: us-east-1
          # Newer AWS CLI versions send checksums that S3-compatible stores can reject.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          DELETE: ${{ inputs.delete && '1' || '0' }}
        run: |
          set -euo pipefail
          args=(--acl public-read --no-progress
                --cache-control "public, max-age=300, must-revalidate"
                --exclude ".git/*" --exclude ".github/*" --exclude ".gitignore"
                --exclude ".claude/*" --exclude "CLAUDE.md" --exclude "README.md"
                # Encrypted shared data, uploaded by hand (tools/pti-share.mjs);
                # excluding it keeps --delete from removing it.
                --exclude "d/*" --exclude "tools/*"
                # index.html is uploaded separately below; excluding it here also
                # keeps --delete from removing it.
                --exclude "index.html")
          [ "$DRY_RUN" = 1 ] && args+=(--dryrun) && echo "DRY RUN: nothing will change."
          [ "$DELETE" = 1 ] && args+=(--delete)
          # A fresh checkout gives every file a new mtime, so each run re-uploads
          # the whole (small) site. That's deliberate: --size-only would miss
          # edits that leave a file the same length.
          aws --endpoint-url "$ENDPOINT" s3 sync . "s3://$BUCKET" "${args[@]}"

          # Serve calculator2.html as the site's home page.
          cp_args=(--acl public-read --no-progress --content-type "text/html"
                   --cache-control "public, max-age=300, must-revalidate")
          [ "$DRY_RUN" = 1 ] && cp_args+=(--dryrun)
          aws --endpoint-url "$ENDPOINT" s3 cp calculator2.html "s3://$BUCKET/index.html" "${cp_args[@]}"

          cluster="$(echo "$ENDPOINT" | sed -E 's#^https://##; s#\.linodeobjects\.com/?$##')"
          echo "Website URL: http://$BUCKET.website-$cluster.linodeobjects.com" >> "$GITHUB_STEP_SUMMARY"
