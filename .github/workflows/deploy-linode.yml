# Publish the calculator site (with calculator2.html as the home page) to the Linode (Akamai) Object Storage bucket
# that serves calc.platform.tennis.
#
#   release branch -> the live site, at the bucket root (calc.platform.tennis/)
#   main           -> the staging copy, in staging/ (calc.platform.tennis/staging/)
#
# Runs on every push to either branch, and on demand from the Actions tab
# ("Run workflow", picking the branch), where you can choose a dry run that only previews changes.
# To release, merge main into release.
#
# Neither deploy ever writes or deletes the encrypted shared data (d/ and staging/d/,
# uploaded with tools/pti_share_sync.py), and the live deploy never touches staging/.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   LINODE_S3_ACCESS_KEY  Object Storage access key (Cloud Manager → Object Storage → Access Keys)
#   LINODE_S3_SECRET_KEY  its secret key
#   LINODE_S3_ENDPOINT    the bucket's cluster endpoint, e.g. https://us-east-1.linodeobjects.com
name: Deploy to Linode

on:
  push:
    branches: [main, release]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; upload nothing"
        type: boolean
        default: false
      delete:
        description: "Also remove files from the bucket that are no longer in the repo"
        type: boolean
        default: false

permissions:
  contents: read

# Never let two deploys to the same place run at once; the newest push wins.
# Live and staging have separate groups, so a push to main never cancels a release.
concurrency:
  group: deploy-linode-${{ github.ref_name }}
  cancel-in-progress: true

env:
  BUCKET: calc.platform.tennis

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          LINODE_S3_ACCESS_KEY: ${{ secrets.LINODE_S3_ACCESS_KEY }}
          LINODE_S3_SECRET_KEY: ${{ secrets.LINODE_S3_SECRET_KEY }}
          LINODE_S3_ENDPOINT: ${{ secrets.LINODE_S3_ENDPOINT }}
        run: |
          missing=()
          [ -n "$LINODE_S3_ACCESS_KEY" ] || missing+=(LINODE_S3_ACCESS_KEY)
          [ -n "$LINODE_S3_SECRET_KEY" ] || missing+=(LINODE_S3_SECRET_KEY)
          [ -n "$LINODE_S3_ENDPOINT" ] || missing+=(LINODE_S3_ENDPOINT)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi
          case "$LINODE_S3_ENDPOINT" in https://*) ;; *)
            echo "::error::LINODE_S3_ENDPOINT should start with https://"; exit 1 ;;
          esac

      - name: Pick the target
        id: target
        run: |
          case "$GITHUB_REF" in
            refs/heads/release) echo "prefix=" >> "$GITHUB_OUTPUT"; echo "Deploying to the live site." ;;
            refs/heads/main) echo "prefix=staging/" >> "$GITHUB_OUTPUT"; echo "Deploying to staging/." ;;
            *) echo "::error::Only main (staging) and release (live) deploy, not $GITHUB_REF"; exit 1 ;;
          esac

      - name: Sync to s3://${{ env.BUCKET }}/${{ steps.target.outputs.prefix }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LINODE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LINODE_S3_SECRET_KEY }}
          ENDPOINT: ${{ secrets.LINODE_S3_ENDPOINT }}
          # Linode ignores the region, but the AWS CLI insists on one.
          AWS_DEFAULT_REGION: us-east-1
          # Newer AWS CLI versions send checksums that S3-compatible stores can reject.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          DELETE: ${{ inputs.delete && '1' || '0' }}
          PREFIX: ${{ steps.target.outputs.prefix }}
        run: |
          set -euo pipefail
          # Staging changes often, so browsers always revalidate it.
          cache="public, max-age=300, must-revalidate"
          [ -n "$PREFIX" ] && cache="no-cache"
          args=(--acl public-read --no-progress
                --cache-control "$cache"
                --exclude ".git/*" --exclude ".github/*" --exclude ".gitignore"
                --exclude ".claude/*" --exclude "CLAUDE.md" --exclude "README.md"
                # Encrypted shared data and key files, uploaded with tools/pti_share_sync.py
                # (d/ live, staging/d/ on staging; paths here are relative to the target);
                # excluding it keeps --delete from removing it.
                --exclude "d/*" --exclude "tools/*"
                # The staging copy: the live deploy must never overwrite or delete it.
                --exclude "staging/*"
                # index.html is uploaded separately below; excluding it here also
                # keeps --delete from removing it.
                --exclude "index.html")
          [ "$DRY_RUN" = 1 ] && args+=(--dryrun) && echo "DRY RUN: nothing will change."
          [ "$DELETE" = 1 ] && args+=(--delete)
          # A fresh checkout gives every file a new mtime, so each run re-uploads
          # the whole (small) site. That's deliberate: --size-only would miss
          # edits that leave a file the same length.
          aws --endpoint-url "$ENDPOINT" s3 sync . "s3://$BUCKET/$PREFIX" "${args[@]}"

          # Serve calculator2.html as the site's home page.
          cp_args=(--acl public-read --no-progress --content-type "text/html"
                   --cache-control "$cache")
          [ "$DRY_RUN" = 1 ] && cp_args+=(--dryrun)
          aws --endpoint-url "$ENDPOINT" s3 cp calculator2.html "s3://$BUCKET/${PREFIX}index.html" "${cp_args[@]}"

          cluster="$(echo "$ENDPOINT" | sed -E 's#^https://##; s#\.linodeobjects\.com/?$##')"
          echo "Website URL: http://$BUCKET.website-$cluster.linodeobjects.com/$PREFIX" >> "$GITHUB_STEP_SUMMARY"
